<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鬼滅の刃 グッズ発売カレンダー（非公式まとめ）</title>

<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<!--__ADSENSE_HEAD__-->
<style>
:root{
  --ink:#111; --sub:#555; --mute:#999; --line:#e5e5e5; --bg:#fff; --soft:#f5f5f5;
  --red:#e60012; --yellow:#ffe100; --blue:#1d5fd1;
  --c-goods:#111; --c-prize:#ff7a00; --c-deadline:#e60012; --c-event:#1d5fd1; --c-cafe:#0e8a5f; --c-reserve:#7b3fe4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.topbar{background:var(--ink);color:#fff;font-size:11px}
.topbar .wrap{display:flex;justify-content:space-between;padding:6px 16px;gap:10px}
.topbar .upd{color:#bbb}
header.mast{border-bottom:4px solid var(--ink)}
header.mast .wrap{display:flex;align-items:center;gap:14px;padding:16px}
.mark{background:var(--red);color:#fff;font-weight:900;font-size:13px;line-height:1.05;padding:8px 9px;letter-spacing:.04em;flex:none}
.ttl{font-weight:900;font-size:clamp(20px,3.2vw,30px);letter-spacing:.02em;line-height:1.2;margin:0}
.ttl small{display:block;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.08em}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:18px 0 12px}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{border:2px solid var(--ink);background:#fff;width:34px;height:34px;font-weight:900;cursor:pointer}
.mnav button:hover{background:var(--ink);color:#fff}
.mlabel{font-family:Oswald,"Noto Sans JP",sans-serif;font-weight:700;font-size:30px;letter-spacing:.02em;min-width:150px;text-align:center;line-height:1}
.mlabel span{font-size:15px;margin-left:2px}
.today-btn{border:2px solid var(--ink);background:var(--yellow);font-weight:900;padding:5px 12px;cursor:pointer}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;padding:5px 11px;font-weight:700;font-size:13px;cursor:pointer}
.chip i{width:10px;height:10px;display:inline-block}
.chip.off{opacity:.35}
.chip:not(.off){border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:2px solid var(--ink);border-left:1px solid var(--line)}
.dow{font-weight:900;font-size:12px;text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:2px solid var(--ink);background:var(--soft)}
.dow.sun{color:var(--red)} .dow.sat{color:var(--blue)}
.day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 4px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.other{background:#fafafa}
.day.other .dn{color:#ccc}
.dn{font-family:Oswald,sans-serif;font-weight:700;font-size:16px;line-height:1;padding:2px 3px 3px}
.day.sun .dn{color:var(--red)} .day.sat .dn{color:var(--blue)}
.day.today{background:#fffbe0;box-shadow:inset 0 0 0 2px var(--yellow)}
.day.today .dn::after{content:"TODAY";font-size:9px;background:var(--ink);color:var(--yellow);padding:1px 4px;margin-left:5px;vertical-align:2px;letter-spacing:.05em}
.pill{display:block;text-align:left;border:none;background:var(--soft);border-left:4px solid var(--c-goods);padding:2px 5px;font-size:11.5px;line-height:1.35;font-weight:700;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;max-height:calc(2.7em + 2px)}
.pill:hover{background:#ececec}
.pill.prize{border-color:var(--c-prize);background:#fff3e8}
.pill.deadline{border-color:var(--c-deadline);background:#ffeef0;color:var(--red)}
.pill.event{border-color:var(--c-event);background:#eef3fc}
.pill.cafe{border-color:var(--c-cafe);background:#e8f6ef;color:#0b5e41}
.pill.reserve{border-color:var(--c-reserve);background:#f3edfd;color:#5523b0}
.cafes{border-top:2px solid var(--ink)}
.cf{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cf:hover{background:var(--soft)}
.cf .p{font-weight:900;font-size:13px;color:var(--c-cafe)}
.cf .n{font-weight:900}
.cf .r{grid-column:2;font-size:12px;color:var(--sub);line-height:1.6}
.cf .r b{color:var(--c-reserve)}
@media (max-width:760px){.cf{grid-template-columns:1fr}.cf .r{grid-column:1}}
.more{font-size:11px;font-weight:700;color:var(--sub);background:none;border:none;text-align:left;cursor:pointer;padding:0 5px}
h2.sec{font-weight:900;font-size:18px;margin:34px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:6px;height:20px;background:var(--red)}
h2.sec small{font-size:12px;color:var(--sub);font-weight:500}
.rows{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:96px 92px 1fr auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.row:hover{background:var(--soft)}
.row .w{font-weight:900;font-size:13px}
.row .n{font-weight:700}
.row .mk{font-size:12px;color:var(--sub);white-space:nowrap}
.lab{display:inline-block;white-space:nowrap;font-size:11px;font-weight:900;color:#fff;padding:2px 7px;text-align:center}
.lab.goods{background:var(--c-goods)} .lab.prize{background:var(--c-prize)} .lab.deadline{background:var(--c-deadline)} .lab.event{background:var(--c-event)} .lab.cafe{background:var(--c-cafe)} .lab.reserve{background:var(--c-reserve)}
.empty{padding:22px;text-align:center;color:var(--mute);border-bottom:1px solid var(--line)}
.agenda{display:none}
.ag-day{display:grid;grid-template-columns:54px 1fr;border-bottom:1px solid var(--line);padding:8px 0}
.ag-d{font-family:Oswald,sans-serif;font-weight:700;font-size:22px;line-height:1;text-align:center}
.ag-d small{display:block;font-family:"Noto Sans JP";font-size:11px;font-weight:700;margin-top:3px}
.ag-day.sun .ag-d{color:var(--red)} .ag-day.sat .ag-d{color:var(--blue)}
.ag-day.today{background:#fffbe0}
.ag-items{display:flex;flex-direction:column;gap:4px;min-width:0}
.ag-items .pill{-webkit-line-clamp:3;max-height:none;font-size:13px;padding:5px 8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.md{background:#fff;max-width:480px;width:100%;border-top:6px solid var(--ink);padding:20px 22px 22px;position:relative;max-height:90vh;overflow:auto}
.md.prize{border-color:var(--c-prize)} .md.deadline{border-color:var(--c-deadline)} .md.event{border-color:var(--c-event)} .md.cafe{border-color:var(--c-cafe)} .md.reserve{border-color:var(--c-reserve)}
.md .x{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;line-height:1}
.md h3{font-size:18px;font-weight:900;margin:8px 0 12px;line-height:1.4;padding-right:20px}
.md dl{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin:0 0 16px;font-size:13px}
.md dt{color:var(--sub);font-weight:700}
.md dd{margin:0}
.md .acts{display:flex;gap:8px;flex-wrap:wrap}
.bt{border:2px solid var(--ink);background:#fff;padding:7px 12px;font-weight:900;font-size:13px;text-decoration:none;cursor:pointer}
.bt.y{background:var(--yellow)}
.re{display:inline-block;font-size:11px;font-weight:900;border:2px solid var(--ink);padding:0 5px;margin-left:6px}
.topbar .lk{display:flex;gap:12px;align-items:center}
.topbar .lk a{color:#fff;text-decoration:none;font-weight:700}
.topbar .lk a:hover{text-decoration:underline}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 0 12px}
.flt input{border:2px solid var(--ink);padding:6px 10px;font:inherit;font-weight:700;min-width:220px;flex:0 1 280px}
.cc{display:flex;flex-wrap:wrap;gap:5px}
.cc button{border:1px solid #ccc;background:#fff;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;border-radius:999px}
.cc button.on{background:var(--red);border-color:var(--red);color:#fff}
.cc button small{color:var(--mute);font-weight:500;margin-left:3px}
.cc button.on small{color:#ffd}
.fnote{font-size:12px;color:var(--red);font-weight:700}
.fnote button{border:none;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px}
.adwrap{margin:24px 0;min-height:1px;text-align:center}
.follow{display:flex;flex-wrap:wrap;gap:10px;margin:34px 0 0;padding:18px;border:2px solid var(--ink);align-items:center}
.follow p{margin:0;font-weight:700;flex:1;min-width:200px}
footer a{color:#ddd}
footer{margin-top:40px;background:var(--ink);color:#aaa;font-size:12px;padding:20px 0 30px}
footer p{margin:4px 0}
@media (max-width:760px){
  .cal{display:none}
  .agenda{display:block;border-top:2px solid var(--ink)}
  .chips{margin-left:0;width:100%}
  .row{grid-template-columns:70px 1fr;gap:4px 10px}
  .row .lb{grid-row:1/3}
  .row .mk{grid-column:2}
}
</style>
</head>
<body>
<div class="topbar"><div class="wrap"><span>非公式ファンまとめ</span><span class="lk"><span class="upd" id="upd"></span><!--__TOPLINKS__--></span></div></div>
<header class="mast"><div class="wrap">
  <div class="mark">鬼滅<br>GOODS</div>
  <h1 class="ttl"><small>DEMON SLAYER GOODS CALENDAR</small>鬼滅の刃 グッズ発売カレンダー</h1>
</div></header>

<main class="wrap">
  <div class="bar">
    <div class="mnav">
      <button id="prev" aria-label="前の月">‹</button>
      <div class="mlabel" id="mlabel"></div>
      <button id="next" aria-label="次の月">›</button>
    </div>
    <button class="today-btn" id="todayBtn">今月</button>
    <div class="chips" id="chips"></div>
  </div>

  <div class="flt">
    <input id="q" type="search" placeholder="🔍 商品名・キャラ名で検索" aria-label="商品名・キャラ名で検索">
    <div class="cc" id="cc"></div>
    <span class="fnote" id="fnote"></span>
  </div>
  <div class="cal" id="cal"></div>
  <div class="agenda" id="agenda"></div>

  <h2 class="sec" id="undatedTtl"></h2>
  <div class="rows" id="undated"></div>

  <!--__AD_SLOT__-->
  <h2 class="sec">開催中・開催予定のカフェ・ダイニング<small>予約方法つき</small></h2>
  <div class="cafes" id="cafes"></div>

  <h2 class="sec">これからの締切・受付・カフェ<small>終了日が近い順</small></h2>
  <div class="rows" id="deadlines"></div>
  <!--__FOLLOW__-->
</main>

<footer><div class="wrap">
  <p>掲載情報はすべて各メーカー・公式ショップの公式サイトで確認したもので、毎日更新しています。発売日・価格は変更されることがあるので、購入前に各公式サイトでご確認ください。「目安」と書かれた日時は公式Xの過去の告知から見込んだもので、確定情報ではありません。</p>
  <!--__FOOTLINKS__--><p>本サイトは非公式のまとめです。©吾峠呼世晴／集英社・アニプレックス・ufotable</p>
</div></footer>

<div class="ov" id="ov"><div class="md" id="md"></div></div>

<script>
/* 最新データの置き場所（GitHub連携後に設定。空ならこのファイルに埋め込んだデータを表示） */
const DATA_URL = "__DATA_URL__";
/* このファイルを作った時点のデータ（予備） */
const EMBED = /*__EMBED__*/null;

const TYPES = {goods:{label:"発売"}, prize:{label:"プライズ"}, cafe:{label:"カフェ"}, reserve:{label:"予約・抽選"}, deadline:{label:"締切"}, event:{label:"イベント"}};
const CATN = {figure:"フィギュア",gacha:"カプセルトイ",prize:"プライズ",food:"食玩・食品",goods:"雑貨・グッズ",card:"カード・パズル",media:"書籍・映像",kuji:"くじ",apparel:"アパレル",event:"イベント",order:"受付・予約",cafe:"コラボカフェ",camp:"キャンペーン",bday:"誕生日"};
const DOW = ["日","月","火","水","木","金","土"];
let ITEMS = [];
let on = {goods:true,prize:true,cafe:true,reserve:true,deadline:true,event:true};
try{ const s=JSON.parse(localStorage.getItem("kmt-filter")||"null"); if(s) on=Object.assign(on,s);}catch(e){}

const now = new Date();
const TODAY = new Date(now.getFullYear(),now.getMonth(),now.getDate());
let cy = TODAY.getFullYear(), cm = TODAY.getMonth()+1;

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const daysTo=s=>Math.round((parse(s)-TODAY)/86400000);
const CHARS=[["炭治郎",["炭治郎","TANJIRO","炭子"]],["禰豆子",["禰豆子","NEZUKO"]],["善逸",["善逸","ZENITSU","善子"]],["伊之助",["伊之助","INOSUKE","猪子"]],["カナヲ",["カナヲ","KANAO"]],["義勇",["義勇","GIYU"]],["しのぶ",["しのぶ","SHINOBU"]],["煉獄",["煉獄","杏寿郎","RENGOKU","KYOJURO"]],["宇髄",["宇髄","天元","UZUI","TENGEN"]],["無一郎",["無一郎","時透","MUICHIRO"]],["蜜璃",["蜜璃","甘露寺","MITSURI"]],["伊黒",["伊黒","小芭内","OBANAI"]],["実弥",["実弥","不死川","SANEMI"]],["悲鳴嶼",["悲鳴嶼","行冥","GYOMEI"]],["猗窩座",["猗窩座","AKAZA","狛治"]],["童磨",["童磨","DOMA","DOUMA"]],["黒死牟",["黒死牟","KOKUSHIBO"]],["無惨",["無惨","MUZAN"]]];
let fq="", fc="";
const hay=it=>[it.name,it.note,it.maker].join(" ").toUpperCase();
const hitChar=(it,c)=>{const e=CHARS.find(x=>x[0]===c);return !!e&&e[1].some(k=>hay(it).includes(k.toUpperCase()));};
const hitQ=it=>{if(!fq)return true;const h=hay(it);const q=fq.toUpperCase();if(h.includes(q))return true;const e=CHARS.find(x=>x[1].some(k=>k.toUpperCase()===q||x[0]===fq));return !!e&&e[1].some(k=>h.includes(k.toUpperCase()));};
const visible=it=>on[it.type]!==false&&hitQ(it)&&(!fc||hitChar(it,fc));
function renderCC(){
  document.getElementById("cc").innerHTML=CHARS.map(([c])=>[c,ITEMS.filter(it=>hitChar(it,c)).length]).filter(x=>x[1]>0).map(([c,n])=>`<button data-c="${esc(c)}" class="${fc===c?"on":""}">${esc(c)}<small>${n}</small></button>`).join("");
  const f=document.getElementById("fnote");
  if(fq||fc){const n=ITEMS.filter(visible).length;f.innerHTML=`${esc([fc,fq].filter(Boolean).join("・"))}で絞り込み中（${n}件）<button id="clr">解除</button>`;}else f.innerHTML="";
}
const safeUrl=u=>/^https?:\/\//.test(u||"")?u:"";

function gcal(it){
  const f=d=>d.replace(/-/g,"");
  const s = it.type==="deadline" ? it.date : (it.start||it.date);
  const e = new Date(parse(it.date).getTime()+86400000);
  const p=new URLSearchParams({action:"TEMPLATE",text:"【鬼滅】"+it.name+(it.type==="deadline"?" 締切":it.type==="goods"?" 発売":it.type==="prize"?" 登場":""),dates:`${f(s)}/${f(ymd(e))}`,details:(it.note||"")+(it.url?"\n"+it.url:"")});
  return "https://calendar.google.com/calendar/render?"+p;
}
function whenText(it){
  if(it.type==="deadline"||it.type==="event"||it.type==="cafe"){
    const e=parse(it.date), f=d=>`${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）`;
    return it.start ? `${f(parse(it.start))} 〜 ${f(e)}` : f(e);
  }
  if(it.date){const d=parse(it.date);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;}
  const [y,m]=(it.ym||"").split("-").map(Number);
  return `${y}年${m}月${it.part||""}${it.part?"":"（日付未定）"}`;
}
function renderChips(){
  document.getElementById("chips").innerHTML = Object.keys(TYPES).map(k=>{
    const n=ITEMS.filter(i=>i.type===k).length;
    return `<button class="chip${on[k]?"":" off"}" data-t="${k}"><i style="background:var(--c-${k})"></i>${k==="goods"?"グッズ発売":k==="cafe"?"カフェ・ダイニング":k==="reserve"?"カフェ予約・抽選":TYPES[k].label}<span style="color:var(--mute);font-weight:500">${n}</span></button>`;
  }).join("");
}
function pill(it,day){ const pre = it.type==="reserve"?"🎟 ":it.type==="deadline"?"⏰ ":it.type==="cafe"?(day&&day===it.start?"☕開始 ":"☕最終日 "):""; return `<button class="pill ${it.type}" data-id="${esc(it.id)}" title="${esc(it.name)}">${pre}${esc(it.name)}</button>`; }
function itemsOn(dateStr){
  const O=["deadline","reserve","cafe","event","goods","prize"];
  return ITEMS.filter(it=>visible(it)&&(it.date===dateStr||(it.type==="cafe"&&it.start===dateStr))).sort((a,b)=>O.indexOf(a.type)-O.indexOf(b.type));
}
function renderCal(){
  document.getElementById("mlabel").innerHTML=`${cy}.${pad(cm)}<span>月</span>`;
  const first=new Date(cy,cm-1,1), start=new Date(first); start.setDate(1-first.getDay());
  const last=new Date(cy,cm,0), end=new Date(last); end.setDate(last.getDate()+(6-last.getDay()));
  let html=DOW.map((d,i)=>`<div class="dow${i===0?" sun":i===6?" sat":""}">${d}</div>`).join("");
  let ag="";
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const s=ymd(d), other=d.getMonth()!==cm-1, w=d.getDay();
    const list=itemsOn(s), isT=s===ymd(TODAY);
    const cls=`day${other?" other":""}${w===0?" sun":w===6?" sat":""}${isT?" today":""}`;
    const MAX=4, shown=list.slice(0,MAX);
    html+=`<div class="${cls}"><div class="dn">${d.getDate()}</div>${shown.map(x=>pill(x,s)).join("")}${list.length>MAX?`<button class="more" data-day="${s}">ほか${list.length-MAX}件</button>`:""}</div>`;
    if(!other && list.length) ag+=`<div class="ag-day${w===0?" sun":w===6?" sat":""}${isT?" today":""}"><div class="ag-d">${d.getDate()}<small>${DOW[w]}</small></div><div class="ag-items">${list.map(x=>pill(x,s)).join("")}</div></div>`;
  }
  document.getElementById("cal").innerHTML=html;
  document.getElementById("agenda").innerHTML=ag||'<div class="empty">この月に日付が決まっている予定はありません</div>';
  const ymKey=`${cy}-${pad(cm)}`, PO={"上旬":1,"中旬":2,"下旬":3};
  const und=ITEMS.filter(it=>visible(it)&&!it.date&&it.ym===ymKey).sort((a,b)=>(PO[a.part]||9)-(PO[b.part]||9)||a.type.localeCompare(b.type));
  document.getElementById("undatedTtl").innerHTML=`${cm}月発売・登場（日付未定）<small>${und.length}件</small>`;
  document.getElementById("undated").innerHTML = und.map(it=>row(it, it.part?`${cm}月${it.part}`:`${cm}月中`)).join("") || '<div class="empty">ありません</div>';
}
function row(it,w){
  return `<button class="row" data-id="${esc(it.id)}"><span class="lb"><span class="lab ${it.type}">${it.type==="goods"?(CATN[it.cat]||"グッズ"):TYPES[it.type].label}</span></span><span class="w">${w}</span><span class="n">${esc(it.name)}${it.re?'<span class="re">再販</span>':""}</span><span class="mk">${esc(it.maker||"")}</span></button>`;
}
function renderDeadlines(){
  const list=ITEMS.filter(it=>(it.type==="deadline"||it.type==="event"||it.type==="cafe")&&visible(it)&&it.date&&daysTo(it.date)>=0).sort((a,b)=>parse(a.date)-parse(b.date)).slice(0,12);
  document.getElementById("deadlines").innerHTML = list.map(it=>{
    const n=daysTo(it.date), d=parse(it.date);
    const started = !it.start || daysTo(it.start)<=0;
    const w = it.type==="cafe"&&!started ? `${daysTo(it.start)}日後開始` : (n===0?"本日まで":`あと${n}日`);
    return `<button class="row" data-id="${esc(it.id)}"><span class="lb"><span class="lab ${it.type}">${TYPES[it.type].label}</span></span><span class="w" style="${n<=3?"color:var(--red)":""}">${w}</span><span class="n">${esc(it.name)}</span><span class="mk">${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）</span></button>`;
  }).join("") || '<div class="empty">近い締切はありません</div>';
}
function renderCafes(){
  const f=d=>{const x=parse(d);return `${x.getMonth()+1}/${x.getDate()}（${DOW[x.getDay()]}）`;};
  const list=ITEMS.filter(it=>it.type==="cafe"&&it.date&&daysTo(it.date)>=0).sort((a,b)=>parse(a.date)-parse(b.date));
  document.getElementById("cafes").innerHTML = list.map(it=>`<div class="cf" data-id="${esc(it.id)}"><span class="p">${it.start?f(it.start)+"〜":""}${f(it.date)}</span><span class="n">${esc(it.name)}<span style="font-weight:500;color:var(--sub);font-size:12px">　${esc(it.maker||"")}</span></span>${it.reserve?`<span class="r"><b>予約：</b>${esc(it.reserve)}</span>`:""}</div>`).join("") || '<div class="empty">開催予定のカフェ・ダイニングはありません</div>';
}
function renderAll(){ renderChips(); renderCC(); renderCal(); renderCafes(); renderDeadlines(); }

function openItem(id){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  const md=document.getElementById("md");
  md.className="md "+it.type;
  const catLabel = it.type==="goods"?(CATN[it.cat]||"グッズ"):it.type==="prize"?"プライズ（UFOキャッチャー・オンクレ景品）":it.type==="cafe"?"カフェ・ダイニング":it.type==="reserve"?"カフェ予約・抽選":(CATN[it.cat]||TYPES[it.type].label);
  const u=safeUrl(it.url), u2=safeUrl(it.url2);
  md.innerHTML=`<button class="x" aria-label="閉じる">×</button>
    <span class="lab ${it.type}">${catLabel}</span>${it.re?'<span class="re">再販</span>':""}
    <h3>${esc(it.name)}</h3>
    <dl>
      <dt>${it.type==="reserve"?"日時":it.type==="deadline"?"締切":(it.type==="event"||it.type==="cafe")?"期間":it.type==="prize"?"登場":"発売"}</dt><dd>${whenText(it)}</dd>
      ${it.maker?`<dt>メーカー</dt><dd>${esc(it.maker)}</dd>`:""}
      ${it.price?`<dt>価格</dt><dd>${esc(it.price)}</dd>`:""}
      ${it.note?`<dt>メモ</dt><dd>${esc(it.note)}</dd>`:""}
      ${it.reserve?`<dt>予約方法</dt><dd>${esc(it.reserve)}</dd>`:""}
      ${it.src?`<dt>情報元</dt><dd>${esc(it.src)}</dd>`:""}
    </dl>
    <div class="acts">${it.date&&daysTo(it.date)>=0?`<a class="bt y" target="_blank" rel="noopener" href="${esc(gcal(it))}">📅 Googleカレンダーに追加</a>`:""}${u?`<a class="bt" target="_blank" rel="noopener" href="${esc(u)}">${esc(it.src||"公式サイト")}で見る ↗</a>`:""}${u2?`<a class="bt" target="_blank" rel="noopener" href="${esc(u2)}">予約ページ ↗</a>`:""}</div>`;
  document.getElementById("ov").classList.add("on");
}
function openDay(s){
  const list=itemsOn(s), d=parse(s), md=document.getElementById("md"); md.className="md";
  md.innerHTML=`<button class="x" aria-label="閉じる">×</button><h3>${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）</h3><div class="ag-items">${list.map(x=>pill(x,s)).join("")}</div>`;
  document.getElementById("ov").classList.add("on");
}
const closeM=()=>document.getElementById("ov").classList.remove("on");
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest(".x")||t.id==="ov"){closeM();return;}
  const p=t.closest("[data-id]"); if(p){openItem(p.dataset.id);return;}
  const m=t.closest(".more"); if(m){openDay(m.dataset.day);return;}
  const cb=t.closest("[data-c]"); if(cb){fc=fc===cb.dataset.c?"":cb.dataset.c; renderAll(); return;}
  if(t.id==="clr"){fc="";fq="";document.getElementById("q").value="";renderAll();return;}
  const c=t.closest(".chip"); if(c){on[c.dataset.t]=!on[c.dataset.t]; try{localStorage.setItem("kmt-filter",JSON.stringify(on));}catch(_){} renderAll();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM();});
document.getElementById("q").addEventListener("input",e=>{fq=e.target.value.trim();renderAll();});
document.getElementById("prev").onclick=()=>{cm--; if(cm<1){cm=12;cy--;} renderCal();};
document.getElementById("next").onclick=()=>{cm++; if(cm>12){cm=1;cy++;} renderCal();};
document.getElementById("todayBtn").onclick=()=>{cy=TODAY.getFullYear();cm=TODAY.getMonth()+1;renderCal();};

function apply(d){
  if(!d||!Array.isArray(d.items)) return false;
  ITEMS=d.items.filter(x=>x&&x.id&&x.type&&TYPES[x.type]);
  document.getElementById("upd").textContent = d.updatedAt ? `最終更新：${String(d.updatedAt).replace("T"," ").slice(0,16)}` : "";
  renderAll(); return true;
}
apply(EMBED) || renderAll();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
if(DATA_URL && !DATA_URL.startsWith("__")){
  fetch(DATA_URL+(DATA_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"})
    .then(r=>r.ok?r.json():null).then(d=>{ if(d && (!EMBED || String(d.updatedAt||"")>=String(EMBED.updatedAt||""))) apply(d); }).catch(()=>{});
}
</script>
</body>
</html>
